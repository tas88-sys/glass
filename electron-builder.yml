# electron-builder.yml

# The unique application ID
appId: com.pickle.glass

# The user-facing application name
productName: Glass

# Publish configuration for GitHub releases
publish:
    provider: github
    owner: pickle-com
    repo: glass
    releaseType: draft

# Protocols configuration for deep linking
protocols:
    name: PickleGlass Protocol
    schemes: 
        - pickleglass

# List of files to be included in the app package
files:
    - src/**/*
    - package.json
    - pickleglass_web/backend_node/**/*
    - '!**/node_modules/electron/**'
    - public/build/**/*
    # Career context embeddings: transformers.js loads onnxruntime-node only;
    # the web runtime (wasm, ~130 MB) is never used in Electron.
    - '!**/node_modules/onnxruntime-web/**'

# Additional resources to be copied into the app's resources directory
extraResources:
    - from: pickleglass_web/out
      to: out

asarUnpack:
    - "src/ui/assets/SystemAudioDump"
    - "**/node_modules/sharp/**/*"
    - "**/node_modules/@img/**/*"
    # Native ONNX runtime for career-context embeddings (loaded in a utilityProcess)
    - "**/node_modules/onnxruntime-node/**/*"

# Windows configuration
win:
    icon: src/ui/assets/logo.ico
    # Ship only this platform's ONNX runtime binaries (~60 MB instead of ~210 MB).
    files:
        - '!**/node_modules/onnxruntime-node/bin/napi-v*/darwin/**'
        - '!**/node_modules/onnxruntime-node/bin/napi-v*/linux/**'
        - '!**/node_modules/onnxruntime-node/bin/napi-v*/win32/arm64/**'
    target:
        - target: nsis
          arch: x64
        - target: portable
          arch: x64
    requestedExecutionLevel: asInvoker
    signAndEditExecutable: true
    cscLink: build\certs\glass-dev.pfx
    cscKeyPassword: "${env.CSC_KEY_PASSWORD}"
    signtoolOptions:
      certificateSubjectName: "Glass Dev Code Signing"

# NSIS installer configuration for Windows
nsis:
    oneClick: false
    perMachine: false
    allowToChangeInstallationDirectory: true
    deleteAppDataOnUninstall: true
    createDesktopShortcut: always
    createStartMenuShortcut: true
    shortcutName: Glass

# macOS specific configuration
mac:
    # The application category type
    category: public.app-category.utilities
    # Path to the .icns icon file
    icon: src/ui/assets/logo.icns
    # Minimum macOS version (supports both Intel and Apple Silicon)
    minimumSystemVersion: '11.0'
    # ONNX runtime ships Apple Silicon only; Intel Macs fall back to BM25 career retrieval.
    files:
        - '!**/node_modules/onnxruntime-node/bin/napi-v*/linux/**'
        - '!**/node_modules/onnxruntime-node/bin/napi-v*/win32/**'
    hardenedRuntime: true
    entitlements: entitlements.plist
    entitlementsInherit: entitlements.plist
    target:
      - target: dmg
        arch: universal
      - target: zip
        arch: universal
