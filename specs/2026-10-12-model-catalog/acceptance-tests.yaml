environments: [local, local-key]

# =============================================================================
# CLI TESTS (deterministic)
# =============================================================================
cli_tests:
  - id: "AT-CLI-001"
    requirement: "FR-001, E1-E3"
    environments: [local]
    command: |-
      node -e "const c=require('./src/features/common/ai/modelCatalog');const a=c.capabilities('groq','x/new').vision===false&&c.capabilities('gemini','gemini-x').vision===true&&c.capabilities('anthropic','claude-x').vision===true;c.seed('groq',[{id:'x/v',vision:true,maxOutput:32768}]);const b=c.capabilities('groq','x/v');c.setOverride('groq','x/v','vision',false);const o=c.capabilities('groq','x/v');process.exit(a&&b.vision===true&&b.source.vision==='api'&&o.vision===false&&o.source.vision==='override'?0:1)"
    expected_exit_code: 0
    description: "Defaults per provider; the API value wins over the default; an override wins over the API."

  - id: "AT-CLI-002"
    requirement: "FR-009, SC-001, E20"
    environments: [local]
    command: |-
      node -e "const c=require('./src/features/common/ai/modelCatalog');const g=require('./src/features/common/ai/providers/groq');c.seed('groq',[{id:'qwen/qwen3.9-27b',vision:true,maxOutput:32768,reasoning:true}]);const t=g.modelTraits('qwen/qwen3.9-27b');const b=g.buildRequest({modelId:'qwen/qwen3.9-27b',messages:[{role:'user',content:['q',{type:'image_url',image_url:{url:'data:image/png;base64,AA'}}]}],env:{}});process.exit(t.vision&&t.reasoning==='qwen3'&&t.maxOutput===32768&&b.imagesSent===1?0:1)"
    expected_exit_code: 0
    description: "A Groq model the catalog reports as seeing images gets the image, with no code change."

  - id: "AT-CLI-003"
    requirement: "FR-016, E17-E19"
    environments: [local]
    command: |-
      node -e "const c=require('./src/features/common/ai/modelCatalog');const f=require('./src/features/common/ai/factory');console.warn=()=>{};c.seed('groq',[{id:'allam-2-7b'},{id:'shared/m'}]);c.seed('gemini',[{id:'shared/m'}]);const s=JSON.stringify(f.splitByProvider('openai/gpt-oss-120b,allam-2-7b,gemini-3.5-flash-lite','groq'));process.exit(f.inferProviderFromModelId('allam-2-7b')==='groq'&&f.inferProviderFromModelId('shared/m','gemini')==='gemini'&&f.inferProviderFromModelId('claude-new')==='anthropic'&&s.includes('allam-2-7b\"]}')?0:1)"
    expected_exit_code: 0
    description: "The provider of an ID comes from the catalog (any shape), the context decides between two, the prefix is the last resort."

  - id: "AT-CLI-004"
    requirement: "FR-011, E26, E27"
    environments: [local]
    command: |-
      node -e "const c=require('./src/features/common/ai/modelCatalog');const a=require('./src/features/common/ai/providers/anthropic');const b=(id,m)=>a.buildRequest({modelId:id,messages:[{role:'user',content:'hi'}],maxTokens:m,env:{}}).params;const u=b('claude-x',900);c.seed('anthropic',[{id:'claude-y',maxOutput:8000,effortLevels:['low','high'],thinking:true}]);const y=b('claude-y',20000);process.exit(!('output_config' in u)&&u.max_tokens===4096&&y.output_config.effort==='low'&&y.max_tokens===8000?0:1)"
    expected_exit_code: 0
    description: "Anthropic: an unknown model gets no effort but the floor; a known one gets its levels and is capped at its max_tokens."

  - id: "AT-CLI-005"
    requirement: "FR-013"
    environments: [local]
    command: |-
      node -e "const c=require('./src/features/common/ai/modelCatalog');const g=require('./src/features/common/ai/providers/gemini');c.seed('gemini',[{id:'gemini-small',maxOutput:8192}]);process.exit(g.maxOutputTokensFor('gemini-new')===65536&&g.maxOutputTokensFor('gemini-small')===8192&&g.maxOutputTokensFor('gemini-small',900)===900?0:1)"
    expected_exit_code: 0
    description: "Gemini: maxOutputTokens never over the model's outputTokenLimit."

  - id: "AT-CLI-006"
    requirement: "FR-008"
    environments: [local]
    command: |-
      node -e "const g=require('./src/features/common/ai/providers/groq');const f=require('./src/features/common/ai/__tests__/fixtures/groq-models.json');const m=Object.fromEntries(f.data.map(g.normalizeModel).map(x=>[x.id,x]));process.exit(m['qwen/qwen3.8-27b'].vision===true&&m['qwen/qwen3.8-27b'].maxOutput===16384&&m['openai/gpt-oss-120b'].vision===false&&m['openai/gpt-oss-120b'].reasoning===true?0:1)"
    expected_exit_code: 0
    description: "Groq: the recorded models response normalizes to the old table's values (research R1)."

  - id: "AT-CLI-007"
    requirement: "FR-002, FR-005, D2"
    environments: [local]
    command: |-
      node -e "const {DatabaseSync}=require('node:sqlite');const S=require('./src/features/common/config/schema').model_catalog;const db=new DatabaseSync(':memory:');db.exec('CREATE TABLE model_catalog ('+S.columns.map(c=>c.name+' '+c.type).join(', ')+', '+S.constraints.join(', ')+')');const r=require('./src/features/common/repositories/modelCatalog/sqlite.repository').createRepository(()=>db);const c=require('./src/features/common/ai/modelCatalog');c.configure({store:r});c.setOverride('groq','x/y','maxOutput',4000);c.resetCatalog();c.configure({store:r});c.load();process.exit(c.capabilities('groq','x/y').maxOutput===4000?0:1)"
    expected_exit_code: 0
    description: "The model_catalog table (built from schema.js) keeps an override across a reload."

  - id: "AT-CLI-008"
    requirement: "FR-020, R4"
    environments: [local]
    command: |-
      node -e "const s=require('fs').readFileSync('src/ui/settings/SettingsView.js','utf8');const bad=['chainProviderOf','modelListOrder(','/^[^\\\\s/]+\\\\/\\\\S+$/'].filter(x=>s.includes(x));if(bad.length){console.error(bad.join(','));process.exit(1)}"
    expected_exit_code: 0
    description: "Settings keeps no copy of the prefix rule or of splitByProvider."

  - id: "AT-CLI-009"
    requirement: "G1, R4"
    environments: [local]
    command: |-
      node -e "const fs=require('fs');const hits=[['src/features/common/ai/providers/groq.js','MODEL_TRAITS'],['src/features/common/ai/providers/anthropic.js','SERVER_FALLBACK_MODELS'],['src/features/common/ai/providers/anthropic.js','claude-(?:fable'],['src/features/common/ai/providerChain.js','seesImages: () => true']].filter(([f,x])=>fs.readFileSync(f,'utf8').includes(x));if(hits.length){console.error(JSON.stringify(hits));process.exit(1)}"
    expected_exit_code: 0
    description: "The capability tables by model name are gone."

  - id: "AT-CLI-010"
    requirement: "C4, E16"
    environments: [local]
    command: |-
      node -e "const s=require('fs').readFileSync('src/features/common/ai/providers/gemini.js','utf8');const a=s.indexOf('async function listModels');const b=s.indexOf('function maxOutputTokensFor');const part=s.slice(s.indexOf('async function fetchModels'),b);process.exit(a>0&&part.includes('x-goog-api-key')&&!part.includes('?key=')?0:1)"
    expected_exit_code: 0
    description: "Gemini's models list sends the key in a header, never in the URL."

  - id: "AT-CLI-011"
    requirement: "Contracts"
    environments: [local]
    command: |-
      npx -y -p typescript@5.4.5 tsc -p specs/2026-10-12-model-catalog/contracts/tsconfig.json
    expected_exit_code: 0
    description: "The contracts type-check."

  - id: "AT-CLI-012"
    requirement: "FR-019"
    environments: [local]
    command: |-
      node build.js > /dev/null && node --input-type=module --check < src/ui/settings/SettingsView.js
    expected_exit_code: 0
    description: "The renderer builds and SettingsView.js parses as a module."

