# Acceptance Tests Manifest (v2)
# Feature: Model Catalog.
# Hand-authored in the /tasks format (SpecKit not installed on this machine).
# Deterministic checks cover the catalog, each provider reading it, the provider of an ID,
# scope guards, the contracts and the build. The Settings screen (SC-004) is manual.
# Commands are YAML literal blocks (no escaping); each is one shell line, run from the repo root.
# The checks seed the catalog themselves: none makes a network call.

# --- Root Fields ---
_version: 2
spec_id: "2026-10-12-model-catalog"
spec_name: "model-catalog"

