# =============================================================================
# LIVE (local-key; reads the model list, no tokens)
# =============================================================================
live_tests:
  - id: "AT-LIVE-001"
    requirement: "SC-003"
    environments: [local-key]
    command: |-
      node -e "require('dotenv').config({quiet:true});const c=require('./src/features/common/ai/modelCatalog');c.configure({fetchers:c.defaultFetchers()});c.refresh('groq',process.env.GROQ_API_KEY,{force:true}).then(()=>{const q=c.capabilities('groq','qwen/qwen3.8-27b');process.exitCode=(q.vision===true&&q.maxOutput===16384&&q.source.vision==='api'&&c.providerOf('openai/gpt-oss-120b')==='groq'?0:1)})"
    expected_exit_code: 0
    description: "Groq's live models list gives Qwen vision and 16,384 from the API."

