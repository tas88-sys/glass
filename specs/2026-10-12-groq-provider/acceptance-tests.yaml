# =============================================================================
# NEGATIVE ASSERTIONS (scope and invariant guards)
# =============================================================================
negative_assertions:
  - id: "AT-NEG-001"
    requirement: "C2, G3, FR-024"
    environments: [local]
    check_type: "cli"
    command: "node -e \"const {execSync}=require('child_process');const out=execSync('git diff --name-only origin/main...HEAD',{encoding:'utf8'});const p='src/features/common/ai/providers/';const guarded=['gemini.js','geminiModelRotator.js','anthropic.js','anthropicErrors.js','modelHealth.js','__tests__/gemini.test.js','__tests__/geminiModelRotator.test.js','__tests__/anthropic.test.js','__tests__/anthropicErrors.test.js','__tests__/anthropicRequest.test.js','__tests__/modelHealth.test.js'].map(f=>p+f);process.stdout.write(String(out.split(/\\r?\\n/).filter(f=>guarded.includes(f)).length))\""
    expected_result: "0"
    description: "The Gemini and Anthropic providers, the shared registry and their tests are not modified."
    severity: critical

  - id: "AT-NEG-002"
    requirement: "C1"
    environments: [local]
    check_type: "cli"
    command: "node -e \"const {execSync}=require('child_process');const out=execSync('git diff --name-only origin/main...HEAD',{encoding:'utf8'});const guarded=['src/features/ask/askService.js','src/features/ask/askStreamState.js','src/features/listen/summary/summaryService.js'];process.stdout.write(String(out.split(/\\r?\\n/).filter(f=>guarded.includes(f)).length))\""
    expected_result: "0"
    description: "The consumers of the stream protocol are not modified."
    severity: critical

  - id: "AT-NEG-003"
    requirement: "C3, FR-021"
    environments: [local]
    check_type: "cli"
    command: "node -e \"const fs=require('fs');let n=0;for(const f of ['groq.js','groqErrors.js']){for(const l of fs.readFileSync('src/features/common/ai/providers/'+f,'utf8').split(/\\r?\\n/)){if(/console\\.(log|warn|error|info)\\(/.test(l)&&/(\\.text\\b|delta\\b|content\\b|reasoning\\b|fullText|chunkText|messages\\b|system\\b)/.test(l))n++}}process.stdout.write(String(n))\""
    expected_result: "0"
    description: "No log statement in the Groq provider references answer text, deltas, content, reasoning, messages or the system prompt."
    severity: critical

  - id: "AT-NEG-004"
    requirement: "C4, FR-004"
    environments: [local]
    check_type: "cli"
    command: "node -e \"const s=require('fs').readFileSync('src/features/common/ai/providers/groq.js','utf8');process.stdout.write(String((s.match(/\\bfetch\\(|api\\.groq\\.com/g)||[]).length))\""
    expected_result: "0"
    description: "No raw HTTP to the Groq API; everything goes through the SDK."
    severity: critical

  - id: "AT-NEG-005"
    requirement: "C4, R3"
    environments: [local]
    check_type: "cli"
    command: "node -e \"process.stdout.write(String(require('./package.json').dependencies['groq-sdk']))\""
    expected_result: "^1.6.0"
    description: "groq-sdk is the version the spec was written against (FR-023, D13)."
    severity: critical

  - id: "AT-NEG-006"
    requirement: "FR-019, D4"
    environments: [local]
    check_type: "cli"
    command: "node -e \"const s=require('fs').readFileSync('src/features/common/ai/providers/groq.js','utf8');const bad=(s.match(/maxRetries\\s*:\\s*[^,}\\s]+/g)||[]).filter(m=>!/:\\s*(0|SDK_MAX_RETRIES)$/.test(m)).length;const pinned=/const SDK_MAX_RETRIES = 0;/.test(s)?0:1;process.stdout.write(String(bad+pinned))\""
    expected_result: "0"
    description: "The provider never lets the SDK retry: every maxRetries it sets is 0 or SDK_MAX_RETRIES, which is defined as 0."
    severity: critical

  - id: "AT-NEG-007"
    requirement: "FR-024"
    environments: [local]
    check_type: "cli"
    command: "node -e \"const {execSync}=require('child_process');const out=execSync('git diff --numstat origin/main...HEAD -- src/features/common/ai/__tests__/factory.test.js',{encoding:'utf8'}).trim();process.stdout.write(out?out.split(/\\s+/)[1]:'0')\""
    expected_result: "0"
    description: "factory.test.js only gains lines: no existing Claude or Gemini assertion is removed or rewritten."
    severity: critical

