# Acceptance Tests Manifest (v2)
# Feature: Groq Provider.
# Hand-authored in the /tasks format (SpecKit not installed on this machine).
# Deterministic checks cover structure, scope guards and the test suite.
# Live API behavior (SC-001, SC-006) is manual and needs the user's Groq key,
# so it is tagged environment local-key.

