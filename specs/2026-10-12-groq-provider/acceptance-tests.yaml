# =============================================================================
# CLI TESTS (deterministic)
# =============================================================================
cli_tests:
  - id: "AT-CLI-001"
    requirement: "FR-006..FR-011, FR-015, FR-016, contracts"
    environments: [local]
    command: "node -e \"const m=require('./src/features/common/ai/providers/groq.js');const need=['GroqProvider','createSTT','createLLM','createStreamingLLM','modelTraits','buildRequest','orderForImages','firstTextTimeoutMs','requestDeadlineMs','idleTimeoutMs'];const miss=need.filter(k=>!m[k]);const e=require('./src/features/common/ai/providers/groqErrors.js');for(const k of ['classify','retryAfterMs','retryAfterHeaderMs','shortErrorMessage','tooLargeNumbers','errorCode'])if(typeof e[k]!=='function')miss.push('groqErrors.'+k);if(miss.length){console.error('missing: '+miss.join(','));process.exit(1)}\""
    expected_exit_code: 0
    description: "The provider and classifier export the contract surface."
    severity: critical

  - id: "AT-CLI-002"
    requirement: "SC-005, FR-006, FR-008, FR-009, FR-010, C5, C7"
    environments: [local]
    command: "node -e \"const {buildRequest}=require('./src/features/common/ai/providers/groq.js');const ids=['openai/gpt-oss-120b','openai/gpt-oss-20b','qwen/qwen3.8-27b','acme/foo-1'];const img={type:'image_url',image_url:{url:'data:image/jpeg;base64,AAAA'}};const msgs=[{role:'system',content:'s'},{role:'user',content:[{type:'text',text:'q'},img]}];const banned=['max_tokens','top_p','logprobs','logit_bias','top_logprobs','n','stream_options','service_tier','tools','response_format'];const bad=[];for(const id of ids)for(const mode of ['stream','once']){const {params:p}=buildRequest({modelId:id,messages:msgs,maxTokens:900,temperature:0.7,mode,env:{}});if(p.stream!==true)bad.push(id+':stream');if(!(p.max_completion_tokens>0))bad.push(id+':budget');for(const k of banned)if(k in p)bad.push(id+':'+k);if('include_reasoning' in p&&'reasoning_format' in p)bad.push(id+':both');const hasImg=JSON.stringify(p.messages).includes('image_url');if(id!=='qwen/qwen3.8-27b'&&hasImg)bad.push(id+':image');if(id==='qwen/qwen3.8-27b'&&!hasImg)bad.push(id+':no-image');if(id==='acme/foo-1'&&('reasoning_effort' in p||'include_reasoning' in p||'reasoning_format' in p))bad.push(id+':reasoning');if(id.startsWith('openai/')&&(p.include_reasoning!==false||p.reasoning_effort!=='low'||p.max_completion_tokens!==1924))bad.push(id+':gpt-oss');if(id==='qwen/qwen3.8-27b'&&(p.reasoning_effort!=='none'||p.max_completion_tokens!==900))bad.push(id+':qwen');if(p.temperature!==0.7)bad.push(id+':temperature');if(p.messages.some(x=>'name' in x))bad.push(id+':name')}if(bad.length){console.error(bad.join(','));process.exit(1)}\""
    expected_exit_code: 0
    description: "Every request streams with the caller's cap plus the reasoning allowance (900 + 1024 on gpt-oss, 900 on Qwen at none); no forbidden field; reasoning fields only for their family and never both forms; images only to the vision model; temperature passed through."
    severity: critical

  - id: "AT-CLI-003"
    requirement: "FR-001, D10"
    environments: [local]
    command: "node -e \"const {PROVIDERS}=require('./src/features/common/ai/factory.js');const g=PROVIDERS.groq;const ids=g?g.llmModels.map(m=>m.id).join(','):'';if(ids!=='openai/gpt-oss-120b,openai/gpt-oss-20b,qwen/qwen3.8-27b'||g.name!=='Groq'||g.sttModels.length!==0){console.error(ids);process.exit(1)}\""
    expected_exit_code: 0
    description: "Groq is registered with exactly the three active chat models, in order, and no STT model."
    severity: critical

  - id: "AT-CLI-004"
    requirement: "FR-002, D2, FR-024"
    environments: [local]
    command: "node -e \"const {inferProviderFromModelId:f}=require('./src/features/common/ai/factory.js');const ok=f('openai/gpt-oss-120b,openai/gpt-oss-20b')==='groq'&&f(' qwen/qwen3.8-27b')==='groq'&&f('claude-haiku-5-5,claude-sonnet-5-5')==='anthropic'&&f('gemini-3-flash-preview')==='gemini'&&f('llama-3.3-70b-versatile')===null&&f('gpt-4.1')===null&&f('a b/c')===null&&f('')===null&&f(null)===null;process.exit(ok?0:1)\""
    expected_exit_code: 0
    description: "vendor/model IDs and lists map to Groq; Claude and Gemini mapping unchanged; anything else to none."
    severity: critical

  - id: "AT-CLI-005"
    requirement: "FR-001"
    environments: [local]
    command: "node -e \"const f=require('./src/features/common/ai/factory.js');const {GroqProvider}=require('./src/features/common/ai/providers/groq.js');process.exit(f.getProviderClass('groq')===GroqProvider&&typeof GroqProvider.validateApiKey==='function'?0:1)\""
    expected_exit_code: 0
    description: "The factory resolves the Groq provider class (key validation in Settings depends on it)."
    severity: critical

  - id: "AT-CLI-006"
    requirement: "FR-001, R2"
    environments: [local]
    command: "node -e \"const fs=require('fs');const files=['src/features/common/ai/providers/groq.js','src/features/common/ai/factory.js'];const re=/llama-3\\.[13]-|qwen3-32b|qwen3\\.6-|llama-4-|kimi-k2|groq\\/compound/;const hits=files.filter(f=>re.test(fs.readFileSync(f,'utf8')));if(hits.length){console.error(hits.join(','));process.exit(1)}\""
    expected_exit_code: 0
    description: "No Groq model retired for free and developer tiers is named in the provider or the factory."
    severity: critical

  - id: "AT-CLI-009"
    requirement: "FR-005, E59"
    environments: [local]
    command: "node -e \"const s=require('fs').readFileSync('src/features/settings/settingsService.js','utf8');process.exit(/providers = \\[[^\\]]*'groq'/.test(s)?0:1)\""
    expected_exit_code: 0
    description: "'Remove all API keys' removes the Groq key too."
    severity: warning

  - id: "AT-CLI-008"
    requirement: "FR-023, D13, C4"
    environments: [local]
    command: "node -e \"require('child_process').execFileSync(require('electron'),['scripts/smoke-groq-sdk.js'],{env:{...process.env,ELECTRON_RUN_AS_NODE:'1'},stdio:'inherit'})\""
    expected_exit_code: 0
    description: "groq-sdk loads with require, streams a canned SSE response, raises typed errors and ends quietly on abort under Electron's Node 20.16 (npm test runs a newer Node and would not catch an incompatibility)."
    severity: critical

  - id: "AT-CLI-007"
    requirement: "Contracts"
    environments: [local]
    command: "npx -p typescript@5.4.5 tsc -p specs/2026-10-12-groq-provider/contracts/tsconfig.json"
    expected_exit_code: 0
    description: "The contracts file type-checks."
    severity: warning

