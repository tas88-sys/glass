    requirement: "C1, FR-019"
    environments: [local]
    check_type: "cli"
    command: |-
      node -e "const {execSync}=require('child_process');const out=execSync('git diff --name-only origin/main...HEAD',{encoding:'utf8'});const guarded=f=>f.startsWith('src/features/common/ai/')||f==='src/features/common/services/modelStateService.js'||f.startsWith('src/features/ask/')||f.startsWith('src/features/listen/stt/');process.stdout.write(String(out.split(/\r?\n/).filter(guarded).length))"
    expected_result: "0"
    description: "The providers, the factory, the chain, the cooldown registry, the model state, Ask and the STT code are not modified."
    severity: critical

  - id: "AT-NEG-002"
    requirement: "C2, FR-019"
    environments: [local]
    check_type: "cli"
    command: |-
      node -e "const {execSync}=require('child_process');const out=execSync('git diff --name-only origin/main...HEAD',{encoding:'utf8'});const bad=f=>f==='src/features/common/config/schema.js'||/\/repositories\//.test(f);process.stdout.write(String(out.split(/\r?\n/).filter(bad).length))"
    expected_result: "0"
    description: "No schema, table, column or repository changes: the choice lives in the settings store."
    severity: critical

  - id: "AT-NEG-003"
    requirement: "C1, D4"
    environments: [local]
    check_type: "cli"
    command: |-
      node -e "const {execSync}=require('child_process');const r=execSync('git diff --numstat origin/main...HEAD -- src/features/listen/summary/summaryService.js',{encoding:'utf8'}).trim().split(/\s+/);process.stdout.write(r.length>=2?String(Number(r[1])):'no-diff')"
    expected_result: "0"
    description: "summaryService.js has no deleted or changed line: only additions (the mode, two methods, two early returns). makeLiveAnswer and makeOutlineAndRequests are untouched."
    severity: critical

  - id: "AT-NEG-004"
    requirement: "FR-019, G3, SC-003"
    environments: [local]
    check_type: "cli"
    command: |-
      node -e "const {execSync}=require('child_process');const d=f=>execSync('git diff --numstat origin/main...HEAD -- '+f,{encoding:'utf8'}).trim();const t='src/features/listen/summary/__tests__/';const h=d('src/ui/listen/summary/__tests__/liveAnswerHistory.test.js').split(/\s+/);const del=h.length>=2?Number(h[1]):0;process.stdout.write([d(t+'liveAnswer.test.js'),d(t+'liveAnswerCareer.test.js')].join('')+'|'+del)"
    expected_result: "|0"
    description: "liveAnswer.test.js and liveAnswerCareer.test.js are not edited, and liveAnswerHistory.test.js only gains lines."
    severity: critical

  - id: "AT-NEG-005"
    requirement: "C3"
    environments: [local]
    check_type: "cli"
    command: |-
      node -e "const {execSync}=require('child_process');const d=execSync('git diff origin/main...HEAD -U0 -- src',{encoding:'utf8',maxBuffer:100000000});const bad=d.split(/\r?\n/).filter(l=>l.startsWith('+')&&!l.startsWith('+++')&&l.includes('[Live]')&&!/\[Live\] features=.{0,24}$/.test(l)&&!/(error|err)\.message/.test(l));process.stdout.write(String(bad.length))"
    expected_result: "0"
    description: "Every added [Live] log line carries only the mode name or an error message, never prompt, answer or transcript text."
    severity: critical

  - id: "AT-NEG-006"
    requirement: "D2, R8"
    environments: [local]
    check_type: "cli"
    command: |-
      node -e "const s=require('fs').readFileSync('src/features/listen/liveFeatures.js','utf8');process.stdout.write(String((s.match(/require\(|import /g)||[]).length))"
