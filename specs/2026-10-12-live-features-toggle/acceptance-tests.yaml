# --- Supported Environments ---
# local: repo only. local-key: repo + a valid LLM key in Settings and audio on the system channel (live calls use provider quota).
environments: [local, local-key]

# =============================================================================
# CLI TESTS (deterministic)
# =============================================================================
cli_tests:
  - id: "AT-CLI-001"
    requirement: "FR-001, contracts"
    environments: [local]
    command: |-
      node -e "const m=require('./src/features/listen/liveFeatures.js');const fn=['normalizeLiveFeatures','answerEnabled','insightsEnabled','nextLiveFeatures','liveFeaturesState','liveFeaturesLabel','viewLabels'];const miss=fn.filter(k=>typeof m[k]!=='function');if(JSON.stringify(m.LIVE_FEATURES)!==JSON.stringify(['both','answer','insights']))miss.push('LIVE_FEATURES');if(m.DEFAULT_LIVE_FEATURES!=='both')miss.push('DEFAULT_LIVE_FEATURES');if(miss.length){console.error('missing: '+miss.join(','));process.exit(1)}"
    expected_exit_code: 0
    description: "liveFeatures.js exports the contract surface."
    severity: critical

  - id: "AT-CLI-002"
    requirement: "FR-001, D1, E1-E4"
    environments: [local]
    command: |-
      node -e "const m=require('./src/features/listen/liveFeatures.js');const j=JSON.stringify;const ok=[m.normalizeLiveFeatures('answer')==='answer',m.normalizeLiveFeatures('ANSWER')==='both',m.normalizeLiveFeatures(null)==='both',m.answerEnabled('answer')&&!m.insightsEnabled('answer'),!m.answerEnabled('insights')&&m.insightsEnabled('insights'),m.answerEnabled('both')&&m.insightsEnabled('both'),m.nextLiveFeatures('both')==='answer',m.nextLiveFeatures('answer')==='insights',m.nextLiveFeatures('insights')==='both',m.nextLiveFeatures('x')==='answer',j(m.liveFeaturesState('answer'))===j({mode:'answer',answer:true,insights:false}),j(m.liveFeaturesState(7))===j({mode:'both',answer:true,insights:true})];const bad=ok.map((v,i)=>v?null:i).filter(x=>x!==null);if(bad.length){console.error('cases '+bad.join(','));process.exit(1)}"
    expected_exit_code: 0
    description: "Normalize, enabled flags, the cycle and the state follow the mode table; an unknown value reads as 'both'."
    severity: critical

  - id: "AT-CLI-003"
    requirement: "FR-013, D9"
    environments: [local]
    command: |-
      node -e "const m=require('./src/features/listen/liveFeatures.js');const j=JSON.stringify;const a=m.viewLabels('answer'),b=m.viewLabels('both'),i=m.viewLabels('insights');const ok=j(a)===j({title:'Live answer',showButton:'Show Answer',copyHover:'Copy Glass Answer'})&&j(b)===j({title:'Live insights',showButton:'Show Insights',copyHover:'Copy Glass Analysis'})&&j(i)===j(b)&&m.liveFeaturesLabel('both')==='Answer + Insights'&&m.liveFeaturesLabel('answer')==='Answer only'&&m.liveFeaturesLabel('insights')==='Insights only'&&m.viewLabels('answer')!==a;process.exit(ok?0:1)"
    expected_exit_code: 0
    description: "The Listen window labels and the Settings button labels match the spec tables; viewLabels returns a fresh object."
    severity: critical

  - id: "AT-CLI-004"
    requirement: "FR-005..FR-009, SC-001..SC-004"
    environments: [local]
    command: |-
      node --test src/features/listen/summary/__tests__/summaryService.liveFeatures.test.js
    expected_exit_code: 0
    description: "The lane gates, the pause, the memory kept and the unchanged default, on a real SummaryService over a stub LLM."
    severity: critical

  - id: "AT-CLI-005"
    requirement: "FR-002, FR-003, FR-004"
    environments: [local]
    command: |-
      node -e "const fs=require('fs');const r=f=>fs.readFileSync(f,'utf8');const miss=[];if(!/liveFeatures:\s*'both'/.test(r('src/features/settings/settingsService.js')))miss.push('settingsService default');const ch=['settings:getLiveFeatures','settings:setLiveFeatures','listen:liveFeaturesChanged'];const fb=r('src/bridge/featureBridge.js');const pl=r('src/preload.js');for(const c of ch){if(!fb.includes(c))miss.push('featureBridge '+c);if(!pl.includes(c))miss.push('preload '+c)}if(miss.length){console.error(miss.join('; '));process.exit(1)}"
    expected_exit_code: 0
    description: "The default, the two IPC handlers, the push channel and the preload surface exist."
    severity: critical

  - id: "AT-CLI-006"
    requirement: "FR-005, FR-007, FR-008, FR-010"
    environments: [local]
    command: |-
      node -e "const fs=require('fs');const r=f=>fs.readFileSync(f,'utf8');const miss=[];const ss=r('src/features/listen/summary/summaryService.js');for(const c of ['setLiveFeatures(','pauseLiveAnswer(','answerEnabled(this.liveFeatures)','insightsEnabled(this.liveFeatures)'])if(!ss.includes(c))miss.push('summaryService '+c);const ls=r('src/features/listen/listenService.js');for(const c of ['setLiveFeatures(','getSettings'])if(!ls.includes(c))miss.push('listenService '+c);if(miss.length){console.error(miss.join('; '));process.exit(1)}"
    expected_exit_code: 0
    description: "The service methods and gates exist, and listenService sets the mode and reads the saved one."
    severity: warning

  - id: "AT-CLI-007"
    requirement: "FR-014, E32, E33"
    environments: [local]
    command: |-
      node -e "const {answersToText:f}=require('./src/ui/listen/summary/liveAnswerHistory.js');const ok=f([])===''&&f(null)===''&&f([{question:'Q2',text:'A2'},{question:'Q1',text:'A1'}])==='Q2\nA2\n\nQ1\nA1'&&f([{text:'A'}])==='A'&&f([{question:'Q',text:''},{text:'B'}])==='B';process.exit(ok?0:1)"
    expected_exit_code: 0
    description: "answersToText joins the answers newest first, skips empty text and returns '' for none."
    severity: critical

  - id: "AT-CLI-008"
    requirement: "FR-007, FR-008, D4"
    environments: [local]
    command: |-
      node -e "const s=require('fs').readFileSync('src/features/listen/summary/summaryService.js','utf8');const body=sig=>{const i=s.indexOf(sig);if(i<0)return '';const j=s.indexOf('{',i);return s.slice(j+1).replace(/^\s+/,'').slice(0,300)};const a=body('triggerAnswerIfNeeded(speaker, text)');const b=body('async triggerAnalysisIfNeeded()');const ok=/^(?:\/\/[^\n]*\s*)*if \(!answerEnabled\(this\.liveFeatures\)\) return;/.test(a)&&/^(?:\/\/[^\n]*\s*)*if \(!insightsEnabled\(this\.liveFeatures\)\) return;/.test(b);process.exit(ok?0:1)"
    expected_exit_code: 0
    description: "The gate is the first statement of each lane trigger, so nothing runs before it (company detection, trace, prefetch, timer, turn count)."
    severity: critical

