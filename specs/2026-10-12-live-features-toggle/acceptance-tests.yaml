# Acceptance Tests Manifest (v2)
# Feature: Live Features Toggle.
# Hand-authored in the /tasks format (SpecKit not installed on this machine).
# Deterministic checks cover the pure rule, the lane gates, the wiring guards and the test suite.
# Behavior in the running app (SC-006 and the Listen window) is manual.
# Commands are YAML literal blocks (no escaping); each is one shell line.
# The CLI checks fail until the tasks that create their targets are done.

# --- Root Fields ---
_version: 2
spec_id: "2026-10-12-live-features-toggle"
spec_name: "live-features-toggle"

# --- Staleness Detection (v2 required) ---
generation_context:
  generated_at: "2026-10-12T00:00:00Z"
  spec_hash: "67f729360e291c1d89ea1ae158908be4bfdcc46174efb127993e38a22822caa5"
  plan_hash: "e3af1dbad57008d96c1b783a9a301ac67896435d21cc592a2f9ce7c1d2d74565"
  tasks_hash: "e39e4d5d9f05ee0d788669f0fbf353e23a9e22bb9dc59b4433f770cd50ad1147"

# --- Drift Detection (v2 required) ---
_references:
  tables: []
  routes: []
  files:
    - "src/features/listen/liveFeatures.js"
    - "src/features/listen/summary/summaryService.js"
    - "src/features/listen/listenService.js"
    - "src/features/settings/settingsService.js"
    - "src/bridge/featureBridge.js"
