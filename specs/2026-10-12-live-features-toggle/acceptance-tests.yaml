    requirement: "All FRs, SC-001..SC-005"
    environments: [local]
    command: |-
      npm test
    expected_exit_code: 0
    description: "Full node:test suite green: the rule, the lane gates, the answersToText additions and every pre-existing test."
    severity: critical

  - id: "AT-GATE-002"
    requirement: "Code quality"
    environments: [local]
    command: |-
      node -e "const {execSync}=require('child_process');const fs=require('fs');const files=execSync('git diff --name-only origin/main...HEAD',{encoding:'utf8'}).split(String.fromCharCode(10)).map(s=>s.trim()).filter(f=>f.endsWith('.js')&&!f.startsWith('src/ui/')&&fs.existsSync(f));for(const f of files)execSync('node --check '+JSON.stringify(f));console.log(files.length+' files ok')" && npm run build:renderer
    expected_exit_code: 0
    description: "Syntax gate. eslint is not installed in this repo, so npm run lint cannot run. Main-process files changed on the branch pass node --check, and the renderer builds with esbuild (this is also the check that ListenView and SettingsView can import liveFeatures.js)."
    severity: warning

  - id: "AT-GATE-003"
    requirement: "Contracts"
    environments: [local]
    command: |-
      npx -p typescript@5.4.5 tsc -p specs/2026-10-12-live-features-toggle/contracts/tsconfig.json
    expected_exit_code: 0
    description: "The contract declarations type-check."
    severity: warning

