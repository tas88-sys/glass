# =============================================================================
# CLI TESTS (deterministic)
# =============================================================================
cli_tests:
  - id: "AT-CLI-001"
    requirement: "FR-005..FR-009, FR-013, FR-014, contracts"
    environments: [local]
    command: "node -e \"const m=require('./src/features/common/ai/providers/anthropic.js');const need=['AnthropicProvider','createSTT','createLLM','createStreamingLLM','buildRequest','acceptsEffort','firstTextTimeoutMs','requestDeadlineMs','idleTimeoutMs'];const miss=need.filter(k=>!m[k]);const e=require('./src/features/common/ai/providers/anthropicErrors.js');for(const k of ['classify','retryAfterMs','shortErrorMessage'])if(typeof e[k]!=='function')miss.push('anthropicErrors.'+k);if(miss.length){console.error('missing: '+miss.join(','));process.exit(1)}\""
    expected_exit_code: 0
    description: "The provider and classifier export the contract surface."
    severity: critical

  - id: "AT-CLI-002"
    requirement: "SC-005, FR-005, C5"
    environments: [local]
    command: "node -e \"const {buildRequest}=require('./src/features/common/ai/providers/anthropic.js');const ids=['claude-opus-5-5','claude-sonnet-5-5','claude-haiku-5-5','claude-haiku-4-5'];const msgs=[{role:'system',content:'s'},{role:'user',content:'q'}];let bad=[];for(const id of ids)for(const stream of [true,false]){const {params}=buildRequest({modelId:id,messages:msgs,maxTokens:900,stream,env:{}});for(const k of ['temperature','top_p','top_k','thinking'])if(k in params)bad.push(id+':'+k);if(id==='claude-haiku-4-5'&&params.output_config)bad.push(id+':effort');if(id==='claude-haiku-5-5'&&params.fallbacks)bad.push(id+':fallbacks')}if(bad.length){console.error(bad.join(','));process.exit(1)}\""
    expected_exit_code: 0
    description: "No request carries sampling parameters or thinking; effort is not sent to Haiku 4.5; fallbacks are not sent to Haiku 5.5."
    severity: critical

  - id: "AT-CLI-003"
    requirement: "FR-001, D9"
    environments: [local]
    command: "node -e \"const {PROVIDERS}=require('./src/features/common/ai/factory.js');const ids=PROVIDERS.anthropic.llmModels.map(m=>m.id).join(',');if(ids!=='claude-opus-5-5,claude-sonnet-5-5,claude-haiku-5-5'){console.error(ids);process.exit(1)}\""
    expected_exit_code: 0
    description: "Anthropic presets are exactly the three current models, in order."
    severity: critical

  - id: "AT-CLI-004"
    requirement: "FR-002"
    environments: [local]
    command: "node -e \"const {inferProviderFromModelId:f}=require('./src/features/common/ai/factory.js');const ok=f('claude-haiku-5-5,claude-sonnet-5-5')==='anthropic'&&f('gemini-3-flash-preview')==='gemini'&&f('gpt-4.1')===null&&f('')===null&&f(null)===null;process.exit(ok?0:1)\""
    expected_exit_code: 0
    description: "claude- IDs and lists map to Anthropic; gemini- to Gemini; anything else to none."
    severity: critical

  - id: "AT-CLI-005"
    requirement: "FR-022, D2"
    environments: [local]
    command: "node -e \"const h=require('./src/features/common/ai/providers/modelHealth.js');const r=require('./src/features/common/ai/providers/geminiModelRotator.js');const same=['parseModelList','pickModel','markFailed','markSucceeded','resetHealth'].every(k=>typeof h[k]==='function'&&r[k]===h[k]);const kept=typeof r.classifyError==='function'&&typeof r.parseRetryAfter==='function';process.exit(same&&kept?0:1)\""
    expected_exit_code: 0
    description: "The Gemini rotator re-exports the shared registry functions and keeps its own classifier."
    severity: critical

  - id: "AT-CLI-006"
    requirement: "FR-001, R1"
    environments: [local]
    command: "node -e \"const fs=require('fs');const files=['src/features/common/ai/providers/anthropic.js','src/features/common/ai/factory.js'];const hits=files.filter(f=>/claude-3[-.]/.test(fs.readFileSync(f,'utf8')));if(hits.length){console.error(hits.join(','));process.exit(1)}\""
    expected_exit_code: 0
    description: "No retired Claude 3.x model ID remains in the provider or the factory."
    severity: critical

  - id: "AT-CLI-008"
    requirement: "FR-023, D11, C4"
    environments: [local]
    command: "node -e \"require('child_process').execFileSync(require('electron'),['scripts/smoke-anthropic-sdk.js'],{env:{...process.env,ELECTRON_RUN_AS_NODE:'1'},stdio:'inherit'})\""
    expected_exit_code: 0
    description: "The upgraded SDK loads with require, streams a canned SSE response, and raises typed errors under Electron's Node 20.16 (npm test runs a newer Node and would not catch an incompatibility)."
    severity: critical

  - id: "AT-CLI-007"
    requirement: "Contracts"
    environments: [local]
    command: "npx -p typescript@5.4.5 tsc -p specs/2026-10-11-anthropic-provider-resilience/contracts/tsconfig.json"
    expected_exit_code: 0
    description: "The contracts file type-checks."
    severity: warning

