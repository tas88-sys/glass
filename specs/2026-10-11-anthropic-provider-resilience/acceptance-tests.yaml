    environments: [local]
    command: "node -e \"const {execSync}=require('child_process');const fs=require('fs');const files=execSync('git diff --name-only origin/main...HEAD',{encoding:'utf8'}).split(String.fromCharCode(10)).map(s=>s.trim()).filter(f=>f.endsWith('.js')&&!f.startsWith('src/ui/')&&fs.existsSync(f));for(const f of files)execSync('node --check \\\"'+f+'\\\"');console.log(files.length+' files ok')\" && npm run build:renderer"
    expected_exit_code: 0
    description: "Syntax gate. eslint is not installed in this repo, so npm run lint cannot run. Main-process files changed on the branch pass node --check, and the renderer (src/ui, ES modules) builds with esbuild."
    severity: warning

# =============================================================================
# NEGATIVE ASSERTIONS (scope and invariant guards)
# =============================================================================
negative_assertions:
  - id: "AT-NEG-001"
    requirement: "C2, G3"
    environments: [local]
    check_type: "cli"
    command: "node -e \"const {execSync}=require('child_process');const out=execSync('git diff --name-only origin/main...HEAD',{encoding:'utf8'});const guarded=['src/features/common/ai/providers/gemini.js','src/features/common/ai/providers/__tests__/gemini.test.js','src/features/common/ai/providers/__tests__/geminiModelRotator.test.js'];process.stdout.write(String(out.split(/\\r?\\n/).filter(f=>guarded.includes(f)).length))\""
    expected_result: "0"
    description: "gemini.js and both Gemini test files are not modified."
    severity: critical

  - id: "AT-NEG-002"
    requirement: "C1"
    environments: [local]
    check_type: "cli"
    command: "node -e \"const {execSync}=require('child_process');const out=execSync('git diff --name-only origin/main...HEAD',{encoding:'utf8'});const guarded=['src/features/ask/askService.js','src/features/ask/askStreamState.js','src/features/listen/summary/summaryService.js'];process.stdout.write(String(out.split(/\\r?\\n/).filter(f=>guarded.includes(f)).length))\""
    expected_result: "0"
    description: "The consumers of the stream protocol are not modified."
    severity: critical

  - id: "AT-NEG-003"
    requirement: "C3, FR-020"
    environments: [local]
    check_type: "cli"
    command: "node -e \"const fs=require('fs');let n=0;for(const f of ['anthropic.js','anthropicErrors.js']){for(const l of fs.readFileSync('src/features/common/ai/providers/'+f,'utf8').split(/\\r?\\n/)){if(/console\\.(log|warn|error|info)\\(/.test(l)&&/(\\.text\\b|delta\\b|fullText|chunkText|messages\\b|system\\b)/.test(l))n++}}process.stdout.write(String(n))\""
    expected_result: "0"
    description: "No log statement in the Anthropic provider references answer text, deltas, messages or the system prompt."
    severity: critical

  - id: "AT-NEG-004"
    requirement: "C4, FR-004"
    environments: [local]
    check_type: "cli"
    command: "node -e \"const s=require('fs').readFileSync('src/features/common/ai/providers/anthropic.js','utf8');process.stdout.write(String((s.match(/\\bfetch\\(|api\\.anthropic\\.com/g)||[]).length))\""
    expected_result: "0"
    description: "No raw HTTP to the Anthropic API; everything goes through the SDK."
    severity: critical

  - id: "AT-NEG-005"
    requirement: "C4, R10"
    environments: [local]
    check_type: "cli"
    command: "node -e \"process.stdout.write(require('./package.json').dependencies['@anthropic-ai/sdk'])\""
    expected_result: "^0.133.0"
    description: "The SDK is upgraded to the version the spec was written against (FR-023, D11)."
    severity: critical

  - id: "AT-NEG-006"
    requirement: "FR-018, D4"
    environments: [local]
    check_type: "cli"
    command: "node -e \"const s=require('fs').readFileSync('src/features/common/ai/providers/anthropic.js','utf8');process.stdout.write(String((s.match(/maxRetries\\s*:\\s*(?!0\\b)[^,}\\s]+/g)||[]).length))\""
    expected_result: "0"
    description: "The provider never lets the SDK retry: every maxRetries it sets is 0."
    severity: critical

