# Acceptance Tests Manifest (v2)
# Feature: Groq Output Limit and Screenshots.
# Hand-authored in the /tasks format (SpecKit not installed on this machine).
# Deterministic checks cover the classification, the request cap, visionOnly in the provider
# and in the chain, scope guards and the test suite. The app behavior (SC-004) is manual.
# Commands are YAML literal blocks (no escaping); each is one shell line, run from the repo root.
# Diff guards compare the working tree with origin/main, so they hold before and after the commit.

# --- Root Fields ---
_version: 2
spec_id: "2026-10-12-groq-otpm-images"
spec_name: "groq-otpm-images"

