# =============================================================================
# CLI TESTS (deterministic)
# =============================================================================
cli_tests:
  - id: "AT-CLI-001"
    requirement: "FR-001, E1-E4"
    environments: [local]
    command: |-
      node -e "const {classify}=require('./src/features/common/ai/providers/groqErrors.js');const e=(status,message)=>({status,error:{error:{message,type:'tokens',code:'rate_limit_exceeded'}}});const ok=[classify(e(429,'Request too large for model qwen on output tokens per minute (OTPM): Limit 1000, Requested 1679.'))==='too-large',classify(e(413,'Request too large for model x on tokens per minute (TPM): Limit 8000, Requested 9400'))==='too-large',classify(e(429,'Rate limit reached for model x on tokens per minute (TPM): Limit 8000, Used 5454, Requested 4212.'))==='transient',classify({status:429})==='transient'];const bad=ok.map((v,i)=>v?null:i).filter(x=>x!==null);if(bad.length){console.error('cases '+bad.join(','));process.exit(1)}"
    expected_exit_code: 0
    description: "A 429 'Request too large' (OTPM) is too-large; a 413 stays too-large; a rate-limit 429 and a bare 429 stay transient."
    severity: critical

  - id: "AT-CLI-002"
    requirement: "FR-002, E1-E3"
    environments: [local]
    command: |-
      node -e "const {tooLargeNumbers:n}=require('./src/features/common/ai/providers/groqErrors.js');const j=JSON.stringify;const m=message=>({status:429,error:{error:{message}}});const ok=[j(n(m('Request too large ... (OTPM): Limit 1000, Requested 1679.')))===j({limit:1000,requested:1679,output:true}),j(n(m('Request too large ... (TPM): Limit 8000, Requested 9400')))===j({limit:8000,requested:9400,output:false}),n(m('Rate limit reached ... (TPM): Limit 8000, Used 5454, Requested 4212.'))===null];const bad=ok.map((v,i)=>v?null:i).filter(x=>x!==null);if(bad.length){console.error('cases '+bad.join(','));process.exit(1)}"
    expected_exit_code: 0
    description: "tooLargeNumbers returns { limit, requested, output } and null for a rate-limit message."
    severity: critical

  - id: "AT-CLI-003"
    requirement: "FR-003, D1, E20-E23"
    environments: [local]
    command: |-
      node -e "const {buildRequest:b}=require('./src/features/common/ai/providers/groq.js');const c=o=>b({messages:[{role:'user',content:'x'}],env:{},...o}).params.max_completion_tokens;const ok=[c({modelId:'qwen/qwen3.8-27b'})===16384,c({modelId:'openai/gpt-oss-120b'})===17408,c({modelId:'acme/foo-1'})===16384,c({modelId:'qwen/qwen3.8-27b',maxTokens:900})===900,c({modelId:'openai/gpt-oss-120b',maxTokens:900})===1924,c({modelId:'openai/gpt-oss-120b',env:{GROQ_MAX_TOKENS:'2048'}})===3072];const bad=ok.map((v,i)=>v?null:i).filter(x=>x!==null);if(bad.length){console.error('cases '+bad.join(','));process.exit(1)}"
    expected_exit_code: 0
    description: "Ask's Groq cap is 16,384 (17,408 with gpt-oss's reasoning); Live Answer's 900 is unchanged; GROQ_MAX_TOKENS still overrides."
    severity: critical

  - id: "AT-CLI-004"
    requirement: "FR-007, E9"
    environments: [local]
    command: |-
      node -e "const g=require('./src/features/common/ai/providers/groq.js');console.warn=()=>{};console.error=()=>{};const msgs=[{role:'user',content:[{type:'text',text:'x'},{type:'image_url',image_url:{url:'data:image/png;base64,AAAA'}}]}];(async()=>{const r=await g.createStreamingLLM({apiKey:'gsk_x',model:'openai/gpt-oss-120b,openai/gpt-oss-20b',visionOnly:true}).streamChat(msgs);const rd=r.body.getReader();try{for(;;){const {done}=await rd.read();if(done)break}process.exit(1)}catch(e){process.exit(e.code==='NO_VISION_MODEL'&&e.userMessage==='No Groq model in the list sees images.'?0:1)}})()"
    expected_exit_code: 0
    description: "visionOnly with an image and no vision model ends with NO_VISION_MODEL before any request (no network is touched: the fake key never reaches Groq)."
    severity: critical

  - id: "AT-CLI-005"
    requirement: "FR-008, E12-E15"
    environments: [local]
    command: |-
      node -e "const {createChainStreamingLLM:chain}=require('./src/features/common/ai/providerChain.js');console.log=()=>{};console.warn=()=>{};const enc=s=>new TextEncoder().encode(s);const ok=()=>new Response(new ReadableStream({start(c){c.enqueue(enc('data: [DONE]\n\n'));c.close()}}));const fail=()=>new Response(new ReadableStream({start(c){c.error(Object.assign(new Error('x'),{userMessage:'x'}))}}));const fake=(id,sees,resp,log)=>({id,seesImages:()=>sees,requestDeadlineMs:()=>60000,firstModel:m=>m[0],createStreamingLLM:o=>{log.push([id,o.visionOnly]);return{streamChat:async()=>resp()}}});const run=async(msgs,keys,geminiSees)=>{const log=[];const r=await chain({segments:[{provider:'groq',models:['qwen/qwen3.8-27b']},{provider:'gemini',models:['gemini-3.5-flash-lite']}],keys,opts:{apiKey:'k'},adapters:{groq:fake('groq',true,fail,log),gemini:fake('gemini',geminiSees,ok,log)},env:{}}).streamChat(msgs);const rd=r.body.getReader();try{for(;;){if((await rd.read()).done)break}}catch{}return JSON.stringify(log)};const img=[{role:'user',content:[{type:'text',text:'x'},{type:'image_url',image_url:{url:'data:image/png;base64,AAAA'}}]}];const txt=[{role:'user',content:'x'}];const K={groq:'g',gemini:'m'};(async()=>{const a=await run(img,K,true);const b=await run(txt,K,true);const c=await run(img,K,false);const d=await run(img,{groq:'g'},true);const want=[JSON.stringify([['groq',true],['gemini',undefined]]),JSON.stringify([['groq',undefined],['gemini',undefined]]),JSON.stringify([['groq',undefined],['gemini',undefined]]),JSON.stringify([['groq',undefined]])];const got=[a,b,c,d];const bad=got.map((g,i)=>g===want[i]?null:i+':'+g).filter(Boolean);if(bad.length){process.stderr.write(bad.join(' '));process.exit(1)}})()"
    expected_exit_code: 0
    description: "The chain sets visionOnly on a segment only with an image and a later segment, with a key, that sees images; never on the later segment itself."
    severity: critical

  - id: "AT-CLI-006"
    requirement: "FR-004, FR-005, D6"
    environments: [local]
    command: |-
      node -e "const s=require('fs').readFileSync('src/features/common/ai/providers/groq.js','utf8');const ok=s.includes('limit=\${tooLarge.limit} requested=\${tooLarge.requested}')&&s.includes('asks for up to \${n.requested} output tokens; this key allows \${n.limit} per minute.');process.exit(ok?0:1)"
    expected_exit_code: 0
    description: "The attempt log carries limit= / requested=, and the OTPM message names output tokens."
    severity: warning

