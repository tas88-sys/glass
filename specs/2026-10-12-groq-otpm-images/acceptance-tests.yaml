# =============================================================================
# NEGATIVE ASSERTIONS (scope and invariant guards)
# =============================================================================
negative_assertions:
  - id: "AT-NEG-001"
    requirement: "C1, FR-010"
    environments: [local]
    check_type: "cli"
    command: |-
      node -e "const {execSync}=require('child_process');const out=execSync('git diff --name-only origin/main',{encoding:'utf8'});const guarded=['src/features/ask/askService.js','src/features/ask/askStreamState.js','src/features/listen/summary/summaryService.js','src/features/common/ai/factory.js','src/features/common/ai/providers/gemini.js','src/features/common/ai/providers/geminiModelRotator.js','src/features/common/ai/providers/anthropic.js','src/features/common/ai/providers/anthropicErrors.js','src/features/common/ai/providers/modelHealth.js'];process.stdout.write(String(out.split(/\r?\n/).filter(f=>guarded.includes(f.trim())).length))"
    expected_result: "0"
    description: "The consumers, the factory, the other providers and the cooldown registry are not modified."
    severity: critical

  - id: "AT-NEG-002"
    requirement: "C5"
    environments: [local]
    check_type: "cli"
    command: |-
      node -e "const {execSync}=require('child_process');const del=f=>{const r=execSync('git diff --numstat origin/main -- '+f,{encoding:'utf8'}).trim().split(/\s+/);return r.length>=2?Number(r[1]):0};const t='src/features/common/ai/__tests__/';process.stdout.write(String(del(t+'providerChain.test.js')+del(t+'providerChain.integration.test.js')))"
    expected_result: "0"
    description: "The chain tests only gain lines."
    severity: critical

  - id: "AT-NEG-003"
    requirement: "C5"
    environments: [local]
    check_type: "cli"
    command: |-
      node -e "const {execSync}=require('child_process');const del=f=>{const r=execSync('git diff --numstat origin/main -- '+f,{encoding:'utf8'}).trim().split(/\s+/);return r.length>=2?Number(r[1]):0};const t='src/features/common/ai/providers/__tests__/';process.stdout.write([del(t+'groq.test.js'),del(t+'groqErrors.test.js'),del(t+'groqRequest.test.js')].join('|'))"
    expected_result: "1|2|6"
    description: "In the Groq tests only the assertions that pinned the old default cap (1 in groq.test.js, 6 lines in groqRequest.test.js) or the old tooLargeNumbers shape (2 in groqErrors.test.js) changed; everything else is an addition."
    severity: critical

  - id: "AT-NEG-004"
    requirement: "C3"
    environments: [local]
    check_type: "cli"
    command: |-
      node -e "const {execSync}=require('child_process');const d=execSync('git diff origin/main -U0 -- src/features/common/ai/providers/groq.js src/features/common/ai/providers/groqErrors.js src/features/common/ai/providerChain.js',{encoding:'utf8',maxBuffer:100000000});const bad=d.split(/\r?\n/).filter(l=>l.startsWith('+')&&!l.startsWith('+++')&&/console\.(log|warn|error)|parts\.push/.test(l)&&/\x24\{[^}]*(messages|content|prompt|answer|apiKey|text)[^}]*\}/.test(l));process.stdout.write(String(bad.length))"
    expected_result: "0"
    description: "No added log line interpolates messages, content, prompt, answer, text or a key: only model IDs, the mode and numbers (fixed words such as answered_by are fine)."
    severity: critical

  - id: "AT-NEG-005"
    requirement: "C2, D4"
    environments: [local]
    check_type: "cli"
    command: |-
      node -e "const s=require('fs').readFileSync('src/features/common/ai/providers/groq.js','utf8');process.stdout.write(String((s.match(/tooLargeNumbers\(/g)||[]).length))"
    expected_result: "2"
    description: "Groq's limit is read only to log it and to word the message (logAttempt, describeFailure). It is never used to build a smaller request: no smaller-cap retry."
    severity: critical

  - id: "AT-NEG-006"
    requirement: "FR-006, E27"
    environments: [local]
    check_type: "cli"
    command: |-
      node -e "const s=require('fs').readFileSync('src/features/common/ai/providers/groq.js','utf8');const i=s.indexOf('function buildRequest(');const sig=s.slice(i,s.indexOf(')',i));process.stdout.write(String(/visionOnly/.test(sig)?1:0))"
    expected_result: "0"
    description: "buildRequest does not take visionOnly, so the option never reaches the SDK request."
    severity: warning

