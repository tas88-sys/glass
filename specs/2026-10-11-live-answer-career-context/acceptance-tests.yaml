# =============================================================================
# CLI TESTS (deterministic)
# =============================================================================
cli_tests:
  - id: "AT-CLI-001"
    requirement: "FR-006, FR-008, FR-013"
    environments: [local]
    command: "node -e \"const fs=require('fs');const d='src/features/common/career/';const need=['index','intentRouter','chunker','textNormalize','bm25','vectorIndex','retriever','contextBuilder','globMatch','kbService'];const miss=need.filter(n=>!fs.existsSync(d+n+'.js'));if(miss.length){console.error('missing: '+miss.join(','));process.exit(1)}\""
    expected_exit_code: 0
    description: "Every core module of the career package exists (contracts surface)."
    severity: critical

  - id: "AT-CLI-002"
    requirement: "SC-005, FR-014"
    environments: [local]
    command: "node --test src/features/listen/summary/__tests__/liveAnswerCareer.test.js"
    expected_exit_code: 0
    description: "Wiring tests pass, including the byte-identical-messages test when the feature is disabled and on the general route."
    severity: critical

  - id: "AT-CLI-003"
    requirement: "FR-014"
    environments: [local]
    command: "node -e \"const s=require('fs').readFileSync('src/features/listen/summary/summaryService.js','utf8');process.exit(/getSystemPrompt\\('pickle_glass_analysis',\\s*[^,]*career[^,]*\\|\\|\\s*''\\s*,\\s*false\\)/.test(s)?0:1)\""
    expected_exit_code: 0
    description: "makeLiveAnswer passes the career block (falling back to '') as customPrompt."
    severity: critical

  - id: "AT-CLI-004"
    requirement: "Contracts"
    environments: [local]
    command: "npx --yes -p typescript@5.4.5 tsc -p specs/2026-10-11-live-answer-career-context/contracts/tsconfig.json"
    expected_exit_code: 0
    description: "Contract declarations type-check."
    severity: warning

  - id: "AT-CLI-005"
    requirement: "FR-015"
    environments: [local]
    command: "node --test src/ui/listen/summary/__tests__/liveAnswerHistory.test.js"
    expected_exit_code: 0
    description: "History keeps sources on create and preserves them on streaming updates."
    severity: critical

  - id: "AT-CLI-006"
    requirement: "FR-019, SC-001, SC-002, SC-003, SC-004"
    environments: [local-kb]
    command: "node scripts/eval-career-kb.js --json --split holdout"
    expected_exit_code: 0
    expected_output_contains: ["\"pass\": true"]
    description: "On the holdout split: personal recall ≥ 0.95, general→personal ≤ 0.10, hybrid recall@3 ≥ 0.85, company leaks = 0, answer-path p95 ≤ 20 ms. The script exits non-zero when any target is missed."
    severity: critical

  - id: "AT-CLI-007"
    requirement: "D7 (only if spike T024 = GO)"
    environments: [local]
    command: "node -e \"const s=require('fs').readFileSync('electron-builder.yml','utf8');process.exit(/asarUnpack:[\\s\\S]*onnxruntime/.test(s)?0:1)\""
    expected_exit_code: 0
    description: "The embedding runtime's native binaries are unpacked from asar (same treatment as sharp). Skip when the spike is NO-GO."
    severity: warning

