# =============================================================================
# NEGATIVE ASSERTIONS (scope and invariant guards)
# =============================================================================
negative_assertions:
  - id: "AT-NEG-001"
    requirement: "C2, FR-018"
    environments: [local]
    check_type: "cli"
    command: "node -e \"const fs=require('fs');const d='src/features/common/career/';let n=0;for(const f of fs.readdirSync(d).filter(f=>f.endsWith('.js'))){for(const l of fs.readFileSync(d+f,'utf8').split(/\\r?\\n/)){if(/(console\\.(log|warn|error|info)|laDebug|careerDebug)\\(/.test(l)&&/\\.(body|block|text)\\b/.test(l))n++}}process.stdout.write(String(n))\""
    expected_result: "0"
    description: "No log statement in the career package references note body, block or turn text."
    severity: critical

  - id: "AT-NEG-002"
    requirement: "C5"
    environments: [local]
    check_type: "cli"
    command: "node -e \"const {execSync}=require('child_process');const out=execSync('git ls-files',{encoding:'utf8'});const bad=out.split(/\\r?\\n/).filter(f=>/(^|\\/)(glass-kb\\.json|questions\\.jsonl|canonical-facts\\.md)$/.test(f));process.stdout.write(String(bad.length))\""
    expected_result: "0"
    description: "No KB artifacts (manifest, eval set, canonical card) are tracked in this public repo."
    severity: critical

  - id: "AT-NEG-003"
    requirement: "C7"
    environments: [local]
    check_type: "cli"
    command: "node -e \"const {execSync}=require('child_process');const out=execSync('git diff --name-only origin/main...HEAD',{encoding:'utf8'});process.stdout.write(String(out.split(/\\r?\\n/).filter(f=>f==='src/features/ask/askService.js'||f==='src/features/common/prompts/promptTemplates.js'||f==='src/features/common/prompts/promptBuilder.js').length))\""
    expected_result: "0"
    description: "Ask, the prompt templates and the prompt builder are not modified."
    severity: critical

  - id: "AT-NEG-004"
    requirement: "C7"
    environments: [local]
    check_type: "cli"
    command: "node -e \"const s=require('fs').readFileSync('src/features/listen/summary/summaryService.js','utf8');process.stdout.write(String((s.match(/getSystemPrompt\\('pickle_glass_analysis', '', false\\)/g)||[]).length))\""
    expected_result: "1"
    description: "The Live Insights lane (makeOutlineAndRequests) still builds its prompt with an empty customPrompt; only makeLiveAnswer changed."
    severity: critical

  - id: "AT-NEG-005"
    requirement: "C4, research R2"
    environments: [local]
    check_type: "cli"
    command: "node -e \"const fs=require('fs');const d='src/features/common/career/';process.stdout.write(String(fs.readdirSync(d).filter(f=>f.endsWith('.js')).filter(f=>/require\\(['\\\"]better-sqlite3|sqliteClient/.test(fs.readFileSync(d+f,'utf8'))).length))\""
    expected_result: "0"
    description: "The retrieval core does not depend on better-sqlite3 (keeps it testable under npm test)."
    severity: critical

  - id: "AT-NEG-006"
    requirement: "R6"
    environments: [local]
    check_type: "cli"
    command: "node -e \"const fs=require('fs');const d='src/features/common/career/';process.stdout.write(String(fs.readdirSync(d).filter(f=>f.endsWith('.js')).filter(f=>/require\\(['\\\"][./]*.*ai\\/factory/.test(fs.readFileSync(d+f,'utf8'))).length))\""
    expected_result: "0"
    description: "Routing and retrieval make no LLM calls (no import of the AI factory in the career package)."
    severity: critical

