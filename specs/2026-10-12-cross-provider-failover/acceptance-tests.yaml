    command: |-
      node -e "const {execSync}=require('child_process');const out=execSync('git diff --numstat origin/main...HEAD -- src/features/common/ai/__tests__/factory.test.js src/features/common/ai/providers/__tests__/modelHealth.test.js',{encoding:'utf8'}).trim();process.stdout.write(String(out?out.split(/\r?\n/).reduce((a,l)=>a+Number(l.split(/\s+/)[1]),0):0))"
    expected_result: "0"
    description: "factory.test.js and modelHealth.test.js only gain lines: no existing assertion is removed or rewritten."
    severity: critical

  - id: "AT-NEG-005"
