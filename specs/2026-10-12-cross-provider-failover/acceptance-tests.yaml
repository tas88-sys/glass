# =============================================================================
# CLI TESTS (deterministic)
# =============================================================================
cli_tests:
  - id: "AT-CLI-001"
    requirement: "FR-001, FR-016, contracts"
    environments: [local]
    command: |-
      node -e "const c=require('./src/features/common/ai/providerChain.js');const f=require('./src/features/common/ai/factory.js');const h=require('./src/features/common/ai/providers/modelHealth.js');const need=['chainDeadlineMs','hasImages','orderSegments','skipReason','segmentTiming','failureMessage','createChainStreamingLLM','createChainLLM'];const miss=need.filter(k=>typeof c[k]!=='function');if(!Array.isArray(c.CHAIN_PROVIDERS))miss.push('CHAIN_PROVIDERS');if(c.FALLBACK_RESERVE_MS!==15000)miss.push('FALLBACK_RESERVE_MS');if(typeof f.splitByProvider!=='function')miss.push('factory.splitByProvider');if(typeof h.isCoolingDown!=='function')miss.push('modelHealth.isCoolingDown');if(miss.length){console.error('missing: '+miss.join(','));process.exit(1)}"
    expected_exit_code: 0
    description: "The chain, the factory addition and the registry query export the contract surface."
    severity: critical

  - id: "AT-CLI-002"
    requirement: "FR-001, D2, E4-E9"
    environments: [local]
    command: |-
      node -e "const {splitByProvider:s}=require('./src/features/common/ai/factory.js');const j=x=>JSON.stringify(x);const cases=[[s('','groq'),[]],[s(null,'groq'),[]],[s('openai/gpt-oss-120b,openai/gpt-oss-20b','groq'),[{provider:'groq',models:['openai/gpt-oss-120b','openai/gpt-oss-20b']}]],[s(' openai/gpt-oss-120b , ,gemini-3.5-flash-lite ','groq'),[{provider:'groq',models:['openai/gpt-oss-120b']},{provider:'gemini',models:['gemini-3.5-flash-lite']}]],[s('gemini-3.5-flash-lite,custom-model','gemini'),[{provider:'gemini',models:['gemini-3.5-flash-lite','custom-model']}]],[s('foo,gemini-y','gemini'),[{provider:'gemini',models:['foo','gemini-y']}]],[s('a/x,gemini-y,b/z','groq').map(x=>x.provider),['groq','gemini','groq']],[s('claude-haiku-5-5,openai/gpt-oss-120b','anthropic').map(x=>x.provider),['anthropic','groq']],[s('gpt-4.1,gemini-y','openai'),[{provider:'openai',models:['gpt-4.1','gemini-y']}]]];const bad=cases.map((c,i)=>j(c[0])===j(c[1])?null:i).filter(x=>x!==null);if(bad.length){console.error('cases '+bad.join(','));process.exit(1)}"
    expected_exit_code: 0
    description: "Lists split into consecutive runs by prefix; unknown IDs join the current run; non-chain providers never split."
    severity: critical

  - id: "AT-CLI-003"
    requirement: "FR-009, FR-010, D7"
    environments: [local]
    command: |-
      node -e "const c=require('./src/features/common/ai/providerChain.js');const t=c.segmentTiming;const n=o=>JSON.stringify(Object.keys(o).filter(k=>o[k]!==undefined).sort().map(k=>[k,o[k]]));const a=t({providerDeadlineMs:45000,leftMs:60000,laterCanRun:true,answerStarted:false});const b=t({providerDeadlineMs:60000,leftMs:59000,laterCanRun:false,answerStarted:false});const s=t({providerDeadlineMs:45000,leftMs:10000,laterCanRun:true,answerStarted:false});const i=t({providerDeadlineMs:null,leftMs:Infinity,laterCanRun:false,answerStarted:false});const st=t({providerDeadlineMs:60000,leftMs:5000,laterCanRun:false,answerStarted:true});const ok=n(a)===n({requestDeadlineMs:45000})&&n(b)===n({requestDeadlineMs:59000})&&s.skip==='deadline'&&n(i)==='[]'&&n(st)==='[]';const d=c.chainDeadlineMs({})===60000&&c.chainDeadlineMs({LLM_CHAIN_DEADLINE_MS:'0'})===null&&c.chainDeadlineMs({LLM_CHAIN_DEADLINE_MS:'30000'})===30000&&c.chainDeadlineMs({LLM_CHAIN_DEADLINE_MS:'abc'})===60000;process.exit(ok&&d?0:1)"
    expected_exit_code: 0
    description: "Segment deadlines keep 15 s for a later segment, skip a segment with no time left, drop the chain limit once an answer started, and never change a provider's own wait before its second round; the chain deadline defaults to 60 s and 0 disables it."
    severity: critical

  - id: "AT-CLI-004"
    requirement: "FR-013, D11"
    environments: [local]
    command: |-
      node -e "const {failureMessage:f}=require('./src/features/common/ai/providerChain.js');const e=Object.assign(new Error('raw'),{userMessage:'All Gemini models failed (1 attempt). Last: x'});const a=f({ran:['groq'],last:e});const b=f({ran:['groq','gemini'],last:e});const c=f({ran:['groq','gemini'],last:e,deadlineMs:60000});const d=f({ran:['groq','gemini'],last:new Error('plain')});const ok=a===e.userMessage&&b==='All providers failed (groq → gemini). Last: '+e.userMessage&&c==='No answer within 60s (groq → gemini). Last: '+e.userMessage&&d.endsWith('Last: plain');process.exit(ok?0:1)"
    expected_exit_code: 0
    description: "One provider that ran keeps its own message; two or more read 'All providers failed (groq → gemini). Last: …'; the deadline reads 'No answer within 60s …'."
    severity: critical

  - id: "AT-CLI-005"
    requirement: "D3, C2"
    environments: [local]
    command: |-
      node -e "require('./src/features/common/ai/providerChain.js');require('./src/features/common/ai/factory.js');const k=Object.keys(require.cache).filter(p=>/groq-sdk|@anthropic-ai|@google/.test(p));if(k.length){console.error(k[0]);process.exit(1)}"
    expected_exit_code: 0
    description: "Loading the chain and the factory loads no SDK: providers are required only when a segment runs."
    severity: warning

  - id: "AT-CLI-006"
    requirement: "FR-016"
    environments: [local]
    command: |-
      node -e "const h=require('./src/features/common/ai/providers/modelHealth.js');h.resetHealth();const a=h.isCoolingDown('m1');h.markFailed('m1',60000);const b=h.isCoolingDown('m1');const p=h.pickModel(['m1','m2']);h.markSucceeded('m1');const c=h.isCoolingDown('m1');process.exit(!a&&b&&p==='m2'&&!c?0:1)"
    expected_exit_code: 0
    description: "isCoolingDown reports a cooldown and leaves the registry as it was."
    severity: critical

  - id: "AT-CLI-007"
    requirement: "FR-003, FR-004, D9"
    environments: [local]
    command: |-
      node -e "const fs=require('fs');const n=f=>(fs.readFileSync(f,'utf8').match(/keys: modelInfo\.keys/g)||[]).length;const m=fs.readFileSync('src/features/common/services/modelStateService.js','utf8');const ok=n('src/features/ask/askService.js')===1&&n('src/features/listen/summary/summaryService.js')===2&&/splitByProvider/.test(m)&&/keys/.test(m);process.exit(ok?0:1)"
    expected_exit_code: 0
    description: "The three LLM call sites pass keys, and getCurrentModelInfo builds them from the list's segments."
    severity: critical

  - id: "AT-CLI-008"
    requirement: "Contracts"
    environments: [local]
    command: |-
      npx -p typescript@5.4.5 tsc -p specs/2026-10-12-cross-provider-failover/contracts/tsconfig.json
    expected_exit_code: 0
    description: "The contracts file type-checks."
    severity: warning

