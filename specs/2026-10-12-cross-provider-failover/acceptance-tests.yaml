    command: |-
      node -e "const {execSync}=require('child_process');const out=execSync('git diff --name-only origin/main...HEAD -- package.json package-lock.json',{encoding:'utf8'}).trim();process.stdout.write(String(out?out.split(/\r?\n/).length:0))"
