# Acceptance Tests Manifest (v2)
# Feature: Cross-Provider Failover.
# Hand-authored in the /tasks format (SpecKit not installed on this machine).
# Deterministic checks cover the pure plan, scope guards and the test suite.
# Live API behavior (SC-001, SC-006) is manual and needs the user's Groq and
# Gemini keys, so it is tagged environment local-key.
# Commands are YAML literal blocks (no escaping); each is one shell line.

